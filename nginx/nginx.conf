server {
    listen 80;
    server_name codebase-cartographer.duckdns.org;

    # ACME challenge directory for Certbot renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name codebase-cartographer.duckdns.org;

    # SSL certificates managed by Certbot
    ssl_certificate /etc/letsencrypt/live/codebase-cartographer.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codebase-cartographer.duckdns.org/privkey.pem;

    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # API endpoints
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (Server-Sent Events) support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # Health check
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Default — reject unknown paths
    location / {
        return 404 '{"error": "Not found"}';
        add_header Content-Type application/json;
    }
}
