server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: codebase-cartographer-api
  lifecycle:
    timeout-per-shutdown-phase: 30s
  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: false
    table: flyway_schema_history
  datasource:
    url: jdbc:postgresql://localhost:5432/cartographer
    username: postgres
    password: yourpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  mvc:
    problemdetails:
      enabled: true
  data:
    redis:
      host: localhost
      port: 6380
      timeout: 2000ms
      client-type: lettuce

allowed:
  origins: "http://localhost:3000"

# JWT Configuration
jwt:
  secret: "codebase-cartographer-secret-key-must-be-at-least-256-bits-long-for-hs256"
  expiration: 86400000  # 24 hours in milliseconds