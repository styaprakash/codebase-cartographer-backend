server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: codebase-cartographer-api
  config:
    import: optional:file:.env[.properties]
  lifecycle:
    timeout-per-shutdown-phase: 30s
  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true
    table: flyway_schema_history
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cartographer}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:yourpassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  mvc:
    problemdetails:
      enabled: true
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      client-type: lettuce

allowed:
  origins: ${FRONTEND_URL:"http://localhost:3000"}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:"codebase-cartographer-secret-key-must-be-at-least-256-bits-long-for-hs256"}
  expiration: ${JWT_EXPIRATION:86400000}  # 24 hours in milliseconds

# Resilience4j Configurations for Embedding Providers
resilience4j:
  ratelimiter:
    instances:
      # Premium API limit: Max 50 requests every 1 second
      premium-api:
        limitForPeriod: 50
        limitRefreshPeriod: 1s
        timeoutDuration: 5s # Wait up to 5s to acquire a permit before failing
  bulkhead:
    instances:
      # Local Ollama limit: Restrict to 4 concurrent GPU executions
      local-ollama:
        maxConcurrentCalls: 4
        # Wait patiently in queue for up to 60s if all 4 slots are occupied
        maxWaitDuration: 60s
  retry:
    instances:
      # Premium API Retry: Exponential backoff for rate limits and server errors
      premium-api:
        maxAttempts: 3
        waitDuration: 2s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2 # Wait 2s, then 4s, then 8s
        retryExceptions:
          # Only retry on 429 Too Many Requests, 5xx errors, and local rate limiter queue full
          - org.springframework.web.client.HttpClientErrorException.TooManyRequests
          - org.springframework.web.client.HttpServerErrorException
          - io.github.resilience4j.ratelimiter.RequestNotPermitted

# LLM API Keys — override via environment variables in production
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}

nvidia:
  api:
    key: ${NVIDIA_API_KEY:}

openai:
  api:
    key: ${OPENAI_API_KEY:}

openrouter:
  api:
    key: ${OPENROUTER_API_KEY:}

gemini:
  api:
    key: ${GEMINI_API_KEY:}

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}