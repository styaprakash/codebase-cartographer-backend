server:
  port: 8080


spring:
  application:
    name: codebase-cartographer-api
  datasource:
    url: jdbc:postgresql://localhost:5432/cartographer
    username: postgres
    password: yourpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  mvc:
    problemdetails:
      enabled: true

allowed:
  origins: "http://localhost:3000"