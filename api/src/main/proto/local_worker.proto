syntax = "proto3";

package localworker;

option java_multiple_files = true;
option java_package = "com.codebasecartographer.api.grpc.proto";
option java_outer_classname = "LocalWorkerProto";

// ─────────────────────────────────────────────────────────────
// LocalWorkerService
//
// A single bidirectional streaming RPC for persistent
// communication between the Rust CLI (Local Compute Agent)
// and the Spring Boot backend.
//
// The CLI initiates the stream. Both sides send messages
// through the open stream for the lifetime of the connection.
// ─────────────────────────────────────────────────────────────

service LocalWorkerService {

  // Persistent bidirectional stream.
  // The CLI calls this once on startup; the stream stays open
  // until the CLI disconnects or the server shuts down.
  rpc Connect (stream WorkerMessage) returns (stream ServerMessage);
}

// ─────────────────────────────────────────────────────────────
// Worker → Server envelope
//
// Uses oneof so new message types can be added without
// changing the RPC signature or breaking existing clients.
// ─────────────────────────────────────────────────────────────

message WorkerMessage {
  oneof payload {
    WorkerHello       hello          = 1;  // Milestone 1 (kept for backward compat)
    RegisterWorker    register       = 2;  // Milestone 2 — full registration
    Heartbeat         heartbeat      = 3;  // Milestone 2 — keep-alive
    // Future fields (reserved for Milestone 3+):
    // JobAccepted      job_accepted   = 4;
    // JobRejected      job_rejected   = 5;
    // StreamChunk      stream_chunk   = 6;
    // JobCompleted     job_completed  = 7;
    // JobFailed        job_failed     = 8;
    // JobCancelled     job_cancelled  = 9;
  }
}

// ─────────────────────────────────────────────────────────────
// Server → Worker envelope
// ─────────────────────────────────────────────────────────────

message ServerMessage {
  oneof payload {
    ServerAck         ack            = 1;
    // Future fields:
    // JobAssignment    job_assignment = 2;
    // CancelJob        cancel_job     = 3;
  }
}

// ─────────────────────────────────────────────────────────────
// Milestone 1 — Connection establishment (kept for compat)
// ─────────────────────────────────────────────────────────────

// Sent by CLI immediately after opening the stream.
message WorkerHello {
  string worker_id   = 1;
  string device_name = 2;
  string cli_version = 3;
}

// General-purpose server acknowledgement.
message ServerAck {
  bool   success = 1;
  string message = 2;
}

// ─────────────────────────────────────────────────────────────
// Milestone 2 — Registration and Heartbeat
// ─────────────────────────────────────────────────────────────

// Sent by CLI immediately after opening the authenticated stream.
// Richer than WorkerHello — includes model inventory.
message RegisterWorker {
  string worker_id              = 1;  // Persistent UUID generated on first CLI install
  string device_name            = 2;  // Human-readable name (e.g. "Satya's MacBook")
  string cli_version            = 3;  // CLI semver (e.g. "0.1.0")
  repeated string available_models = 4;  // Ollama models available locally
}

// Sent by CLI periodically (e.g. every 30 seconds).
message Heartbeat {
  int64 timestamp = 1;  // Unix milliseconds
}
