services:
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    volumes:
      - dragonflydata:/data
    ulimits:
      memlock: -1

  api:
    image: us-east1-docker.pkg.dev/project-2fb168c7-413a-4010-acf/cartographer-repo/backend-api:latest
    # Removed ports, api is now internal-only. Reached via nginx.
    environment:
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - SPRING_DATA_REDIS_HOST=dragonfly
      - SPRING_DATA_REDIS_PORT=6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - API_RATE_LIMIT=${API_RATE_LIMIT:-15}
      - API_RATE_REFRESH=${API_RATE_REFRESH:-60s}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - FRONTEND_URL=https://codebase-cartographer-live.vercel.app
      - FRONTEND_CORS=https://codebase-cartographer-live.vercel.app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      dragonfly:
        condition: service_started

  prometheus:
    image: prom/prometheus:latest
    # Removed ports, internal-only
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    # Removed ports, internal-only
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    volumes:
      - grafanadata:/var/lib/grafana

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    command: /bin/sh -c "while :; do sleep 6h; nginx -s reload; done & nginx -g 'daemon off;'"
    depends_on:
      - api

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'while :; do certbot renew --quiet; sleep 12h; done'"

volumes:
  pgdata:
  dragonflydata:
  grafanadata:
  certbot-certs:
  certbot-webroot:
